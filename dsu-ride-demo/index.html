<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d2f">
<meta name="description" content="Find, reserve, and ride shared electric scooters around the DSU Harohalli campus.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DSU Ride">
<title>DSU Ride — Campus mobility</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="boot">DSU Ride needs JavaScript to run.</p></noscript>
<script>
  // JavaScript modules can't load from file://, so explain how to open the app instead of showing a blank page.
  if (location.protocol === 'file:') {
    document.getElementById('app').innerHTML =
      '<div class="boot"><b>Open DSU Ride through a web server</b>Run <code>npm start</code> in the project folder, ' +
      'or use the live app at <a href="https://aakashr-exe.github.io/DSU-Ride-Concept-Demo/">aakashr-exe.github.io/DSU-Ride-Concept-Demo</a>.</div>';
  }
</script>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
